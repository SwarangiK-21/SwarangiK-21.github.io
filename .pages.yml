# Pages CMS configuration (https://pagescms.org)
# Gives you a point-and-click editor for the files in /content.
# Sign in at https://app.pagescms.org with your GitHub account and open this repository.

media:
  input: assets
  output: assets

content:
  - name: profile
    label: Profile, contact & resume
    type: file
    path: content/profile.json
    format: json
    fields:
      - { name: name, label: Display name, type: string, required: true }
      - { name: fullName, label: Full name, type: string }
      - { name: initials, label: Initials (shown when there is no photo), type: string }
      - { name: headline, label: Headline, type: string, description: "Shown under your name, e.g. Data Analyst & AI Developer" }
      - { name: typingLines, label: Typing animation lines, type: string, list: true }
      - { name: intro, label: Short intro (hero), type: text }
      - { name: location, label: Location, type: string }
      - { name: photo, label: Profile photo, type: image, description: "Square photo works best. Leave empty to show your initials." }
      - { name: openTo, label: '"Open to" badge', type: string, description: "Leave empty to hide the badge" }
      - { name: about, label: About me paragraphs, type: text, list: true }
      - name: highlights
        label: About stats
        type: object
        list: true
        description: 'Use "auto" as the value to show the number of visible projects'
        fields:
          - { name: value, type: string }
          - { name: label, type: string }
      - name: resume
        label: Resume
        type: object
        fields:
          - { name: file, label: Resume PDF, type: file, description: "Upload your latest PDF here" }
          - { name: updated, label: Last updated (text), type: string }
      - name: socials
        label: Social & profile links
        type: object
        list: true
        description: "Leave a URL empty to hide that link"
        fields:
          - { name: name, type: string }
          - name: icon
            type: select
            options:
              values: [github, linkedin, hackerrank, trailblazer, email, website]
          - { name: url, label: URL, type: string }
      - name: contact
        label: Contact section
        type: object
        fields:
          - { name: email, type: string }
          - { name: phone, type: string, description: "Leave empty to keep your number private" }
          - { name: location, type: string }
          - { name: message, type: text }
          - { name: formspreeEndpoint, label: Formspree form URL (optional), type: string, description: "e.g. https://formspree.io/f/abcdwxyz. Leave empty for an Email me button." }

  - name: projects
    label: Projects
    type: file
    path: content/projects.json
    format: json
    list: true
    fields:
      - { name: title, type: string, required: true }
      - { name: tagline, type: string }
      - { name: description, type: text }
      - { name: points, label: Detail bullet points, type: string, list: true }
      - { name: tech, label: Technologies, type: string, list: true }
      - name: category
        type: select
        options:
          values: ["AI & Agents", "Full-Stack", "Data & BI", "Machine Learning", "Other"]
      - { name: github, label: GitHub URL, type: string }
      - { name: demo, label: Live demo URL, type: string }
      - { name: image, label: Screenshot, type: image, description: "16:9 screenshot. Leave empty for automatic cover art." }
      - { name: status, label: Status badge, type: string, description: 'e.g. "In progress". Leave empty for none.' }
      - { name: featured, label: Featured (shown first), type: boolean }
      - { name: show, label: Show on website, type: boolean }

  - name: experience
    label: Experience
    type: file
    path: content/experience.json
    format: json
    list: true
    fields:
      - { name: role, type: string, required: true }
      - { name: company, type: string }
      - { name: location, type: string }
      - { name: start, type: string, description: "e.g. May 2026" }
      - { name: end, type: string, description: "e.g. Present" }
      - { name: type, type: string, description: "e.g. Internship, Full-time" }
      - { name: points, label: Bullet points, type: text, list: true }
      - { name: tech, label: Technologies, type: string, list: true }

  - name: skills
    label: Skills
    type: file
    path: content/skills.json
    format: json
    list: true
    fields:
      - { name: group, label: Group name, type: string }
      - name: icon
        type: select
        options:
          values: [code, database, spark, layers, chart, tools, cpu]
      - { name: items, label: Skills, type: string, list: true }

  - name: achievements
    label: Achievements
    type: file
    path: content/achievements.json
    format: json
    list: true
    fields:
      - { name: title, type: string }
      - { name: detail, type: text }
      - { name: year, type: string }
      - name: icon
        type: select
        options:
          values: [trophy, star, book, award]
      - { name: link, label: Link (optional), type: string }

  - name: certifications
    label: Certifications
    type: file
    path: content/certifications.json
    format: json
    list: true
    fields:
      - { name: title, type: string }
      - { name: issuer, type: string }
      - { name: year, type: string }
      - { name: link, label: Credential link (optional), type: string }

  - name: education
    label: Education
    type: file
    path: content/education.json
    format: json
    list: true
    fields:
      - { name: institution, type: string }
      - { name: location, type: string }
      - { name: degree, type: string }
      - { name: start, type: string }
      - { name: end, type: string }
      - { name: score, type: string }
